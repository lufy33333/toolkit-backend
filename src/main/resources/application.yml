server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/toolkit?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: your-super-secret-key-at-least-32-characters-long-for-security
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.toolkit: DEBUG
    org.springframework.security: DEBUG