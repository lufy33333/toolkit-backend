server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:sqlite:./data/toolkit.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:your-super-secret-key-at-least-32-characters-long-for-security}
  expiration: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.toolkit: DEBUG
    org.springframework.security: DEBUG